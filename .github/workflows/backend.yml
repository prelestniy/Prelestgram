# Проверка серверной части: миграции на настоящем PostgreSQL, запуск API, сборка Docker-образа
name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  test:
    name: Миграции и запуск API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prelestgram
          POSTGRES_USER: prelestgram
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prelestgram -d prelestgram"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    # Тестовая конфигурация: секреты здесь фиктивные и нужны только для CI
    env:
      APP_ENV: dev
      SECRET_KEY: ci-secret-key-not-for-production-use
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: prelestgram
      POSTGRES_USER: prelestgram
      POSTGRES_PASSWORD: ci-password
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: ci
      MINIO_ROOT_PASSWORD: ci-minio-password
      BOT_TOKEN: "123456:ci-fake-token"
      ADMIN_TELEGRAM_IDS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Проверка синтаксиса
        run: python -m compileall -q app alembic

      - name: Миграции вверх
        run: alembic upgrade head

      - name: Модели совпадают с миграциями
        run: alembic check

      - name: Откат и повторное применение
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Запуск API и health-check
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health; then echo; exit 0; fi
            sleep 1
          done
          echo "API не ответил на /api/health" >&2
          exit 1

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка образа backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: prelestgram-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
